<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Crea tu cuenta en Calico Floristería" />
    <meta name="theme-color" content="#6a5294" />
    <title>Crear cuenta | Calico Floristería</title>
    <link rel="icon" type="image/png" href="Imagenes/Lavanda Imagotipo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Yellowtail&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth">
      <img class="auth__logo" src="Imagenes/Logotipo Hueso.png" alt="Calico Floristería" width="260" height="148" />

      <section class="card" aria-labelledby="titulo">
        <h1 id="titulo">Crear cuenta</h1>
        <p class="subtitle">Regístrate para comprar</p>

        <form id="register-form" class="form" novalidate>
          <p class="form-error" id="form-error" role="alert" hidden></p>

          <div class="field">
            <label for="name">Nombre completo</label>
            <input type="text" id="name" name="name" autocomplete="name" required />
            <p class="error" data-error-for="name"></p>
          </div>

          <div class="field">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
            <p class="error" data-error-for="email"></p>
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required />
            <p class="error" data-error-for="password"></p>
          </div>

          <div class="field">
            <label for="confirm">Confirmar contraseña</label>
            <input type="password" id="confirm" name="confirm" autocomplete="new-password" required />
            <p class="error" data-error-for="confirm"></p>
          </div>

          <button class="btn btn--block" type="submit">Crear cuenta</button>
        </form>

        <p class="switch">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
