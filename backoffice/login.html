<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Inicia sesión en Calico Floristería" />
    <meta name="theme-color" content="#6a5294" />
    <title>Iniciar sesión | Calico Floristería</title>
    <link rel="icon" type="image/png" href="Imagenes/Lavanda Imagotipo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Yellowtail&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth">
      <img class="auth__logo" src="Imagenes/Hueso Imagotipo.png" alt="Calico Floristería" width="260" height="148" />

      <section class="card" aria-labelledby="titulo">
        <h1 id="titulo">Iniciar sesión</h1>
        <p class="subtitle">Entra para ver nuestro catálogo</p>

        <form id="login-form" class="form" novalidate>
          <p class="form-error" id="form-error" role="alert" hidden></p>

          <div class="field">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
            <p class="error" data-error-for="email"></p>
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
            <p class="error" data-error-for="password"></p>
          </div>

          <button class="btn btn--block" type="submit">Entrar</button>
        </form>

        <p class="switch">¿Aún no tienes cuenta? <a href="register.html">Regístrate</a></p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
